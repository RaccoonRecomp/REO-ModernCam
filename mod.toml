[manifest]
id = "REO_ModernCam"
version = "2.0.0"
display_name = "Resident Evil Outbreak — Modern Camera"
description = """
A port of Snippy's Outbreak ModernCam to the recompilation of the US release (SLUS-20765, disc version 2.00).

Replaces the fixed camera angles with an over-the-shoulder camera you turn with the right stick or the mouse:
- Main, Aim and Alt framings, blended as you raise the weapon
- Free gun elevation that follows the camera, walking while aiming, a crosshair
- Reload, sprint, shoot and special-action buttons, shoulder swap, recenter
- Camera collision against the room's walls
- Borrows the nearest room camera so the game still draws what the view needs

Every setting can be changed while playing. Outbreak ModernCam is Snippy's work (heysnippy.com); ask Snippy before
publishing this port.
"""
short_description = "Over-the-shoulder camera for Resident Evil Outbreak (NTSC-U v2.00)"
authors = [ "RaccoonRecomp", "Snippy (Outbreak ModernCam)" ]
# Must match the game_id the recomp registers for the regular (black-label) build, SLUS-20765 v2.00.
game_id = "reo"
minimum_recomp_version = "1.0.0"
dependencies = []
native_libraries = []

[inputs]
elf_path = "build/mod.elf"
mod_filename = "REO_ModernCam"
# Function reference symbols for SLUS-20765 v2.00 (this mod references no game functions).
func_reference_syms_file = "syms/reo.syms.toml"
data_reference_syms_files = []
additional_files = [ "thumb.png" ]

[[manifest.config_options]]
id = "enabled"
name = "Modern Camera"
description = "Over-the-shoulder camera (the exe's Start/Stop). Off hands the camera and everything else back to the game."
type = "Enum"
options = [ "Off", "On" ]
default = "On"

[[manifest.config_options]]
id = "distance"
name = "Distance"
description = "How far behind her the camera sits."
type = "Number"
min = 100
max = 600
step = 5
precision = 0
percent = false
default = 300

[[manifest.config_options]]
id = "shoulder"
name = "Left / Right"
description = "Sideways offset. Positive = over her right shoulder, negative = left. Swap Shoulder writes the new side here."
type = "Number"
min = -150
max = 150
step = 5
precision = 0
percent = false
default = 50

